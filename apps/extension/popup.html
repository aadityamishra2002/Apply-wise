<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Apply Wise</h1>
      <p class="muted">Review a job page before sending it for scoring.</p>
      <section id="pairing">
        <label>Pairing code<input id="code" placeholder="Code from Apply Wise Settings"></label>
        <button id="pair">Pair extension</button>
      </section>
      <section id="capture" hidden>
        <label>Job title<input id="title"></label>
        <label>Company<input id="company"></label>
        <label>Location<input id="location"></label>
        <label>Job URL<input id="url"></label>
        <label>Description<textarea id="description"></textarea></label>
        <section id="quality-preview">
          <h2>Capture readiness</h2>
          <ul id="quality-list"></ul>
        </section>
        <button class="secondary" id="refresh">Re-extract current page</button>
        <button id="send">Send to Apply Wise</button>
        <button class="secondary" id="inspect-form">Inspect application form</button>
        <section id="form-preview" hidden>
          <h2>Detected application fields</h2>
          <p class="muted">Preview only. Apply Wise does not fill or submit these fields yet.</p>
          <ul id="detected-fields"></ul>
        </section>
        <button class="secondary" id="unpair">Unpair extension</button>
      </section>
      <p id="message"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
